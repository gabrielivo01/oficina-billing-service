spring.application.name=oficina-billing-service
server.port=${SERVER_PORT:8082}
# Spring Boot 4 lê spring.mongodb.uri (spring.data.mongodb.uri não é mais aplicado). A variável SPRING_DATA_MONGODB_URI
# continua aceita para não mudar o Deployment; SPRING_MONGODB_URI tem precedência.
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/billing_db?replicaSet=rs0}}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:oficina}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.metrics.export.enabled=false
logging.structured.format.console=logstash
app.security.enabled=${APP_SECURITY_ENABLED:true}
jwt.secret=${JWT_SECRET}
app.mensageria.exchange-comandos=oficina.comandos
app.mensageria.exchange-eventos=oficina.eventos
app.mensageria.fila-comandos=billing.comandos
app.mensageria.outbox.publicador-habilitado=${APP_MENSAGERIA_OUTBOX_PUBLICADOR_HABILITADO:true}
app.mensageria.outbox.intervalo=1s
app.mensageria.outbox.lote=50
app.mensageria.outbox.timeout-confirmacao=5s
app.pagamento.gateway=${APP_PAGAMENTO_GATEWAY:fake}
app.pagamento.fake.status-inicial=${APP_PAGAMENTO_FAKE_STATUS_INICIAL:PENDENTE}
app.pagamento.intervalo-verificacao=${APP_PAGAMENTO_INTERVALO_VERIFICACAO:30s}
app.pagamento.mercadopago.access-token=${MP_ACCESS_TOKEN:}
app.pagamento.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
app.pagamento.mercadopago.notification-url=${MP_NOTIFICATION_URL:}
app.pagamento.mercadopago.back-url=${MP_BACK_URL:http://localhost:8082/pagamento/retorno}
app.notificacao.remetente=${APP_NOTIFICACAO_REMETENTE:oficina@localhost}
app.notificacao.intervalo=${APP_NOTIFICACAO_INTERVALO:5s}
management.observations.enable.tasks.scheduled=false
#---
spring.config.activate.on-profile=local
app.security.enabled=false
jwt.secret=${JWT_SECRET:billing-local-only-secret-change-before-sharing}
