apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oficina-billing-service
  namespace: oficina
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: oficina-billing-service
  namespaceSelector:
    matchNames: ["oficina"]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
