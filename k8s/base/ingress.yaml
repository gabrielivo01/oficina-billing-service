apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-billing-service
  namespace: oficina
spec:
  ingressClassName: nginx
  rules:
    - host: billing.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  name: http
