apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-service
  namespace: oficina
data:
  SPRING_RABBITMQ_HOST: rabbitmq.plataforma.svc.cluster.local
  SPRING_MAIL_HOST: mailhog.plataforma.svc.cluster.local
  APP_PAGAMENTO_GATEWAY: fake
  APP_SECURITY_ENABLED: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.plataforma.svc.cluster.local:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
